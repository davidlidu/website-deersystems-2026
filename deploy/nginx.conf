# Nginx para el sitio estático de DeerSystems.
# En Dokploy, Traefik termina el HTTPS y reenvía el tráfico a este contenedor por el puerto 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # ── Compresión ──
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ── Cabeceras de seguridad ──
    include /etc/nginx/snippets/security-headers.conf;

    # Chequeo de salud para Docker/Dokploy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Archivos con hash de Vite: caché de 1 año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Imágenes y fuentes: caché de 30 días.
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # URLs limpias: /privacidad y /terminos sirven sus .html.
    location = /privacidad { try_files /privacidad.html =404; }
    location = /terminos   { try_files /terminos.html =404; }

    # HTML: sin caché, para que cada despliegue se vea de inmediato.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
