<style>
/* ============================================================
   TOKENS — Design System DeerSystems (tema Oscuro).
   Valores tomados de project/tokens.json. No editar por cliente.
   ============================================================ */
:root{
  --verde:#7ed957; --cian:#00b4d8; --azul:#051923; --violeta:#7209b7; --pizarra:#1e293b;
  --bruma:#94a3b8; --oro:#ffb703; --coral:#ef476f;
  --verde-hover:#8fe46a; --verde-profundo:#62c23c;

  --canvas:#051923; --canvas-soft:#082330; --surface:#1e293b6b; --surface-strong:#0d2a38;
  --ink:#f2f6f8; --body:#b9c6d2; --mute:#94a3b8;
  --hairline:#94a3b829; --hairline-strong:#94a3b84d;

  --primary:var(--verde); --on-primary:var(--azul); --primary-text:#7ed957;
  --link:#00b4d8; --accent-ai:#7209b7; --on-accent:#ffffff; --warning-text:#ffb703;

  --font-display:"Montserrat",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-7:48px; --space-8:72px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-pill:999px;

  --grad:linear-gradient(100deg,var(--verde) 0%,#3fcf9c 45%,var(--cian) 100%);
  --ease:cubic-bezier(.22,1,.36,1);
  --topbar:60px; --gutter:clamp(20px,4vw,48px);
}

*{box-sizing:border-box}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;background:var(--canvas);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--body);font:400 16px/26px var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* ---------- Componentes del sistema (components/bundle.css) ---------- */
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ds-btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:14px 22px;border:1px solid transparent;border-radius:var(--radius-sm);font:600 15px/20px var(--font-body);cursor:pointer;text-decoration:none;transition:background .2s var(--ease),border-color .2s var(--ease)}
.ds-btn--primary{background:var(--primary);color:var(--on-primary)}
.ds-btn--primary:hover{background:var(--verde-hover)}
.ds-btn--primary:active{background:var(--verde-profundo)}
.ds-btn--outline{background:transparent;color:var(--ink);border-color:var(--hairline-strong)}
.ds-btn--outline:hover{border-color:var(--cian)}
.ds-btn--sm{padding:8px 14px;font-size:14px}
.ds-chip{display:inline-flex;align-items:center;padding:7px 12px;border-radius:var(--radius-pill);font:500 12px/16px var(--font-body);background:color-mix(in srgb,var(--verde) 12%,transparent);color:var(--primary-text);text-decoration:none}
.ds-chip--ai{background:var(--accent-ai);color:var(--on-accent)}
a.ds-chip{transition:outline-color .2s var(--ease)}
a.ds-chip:hover{outline:1px solid var(--cian);outline-offset:1px}
.ds-card,.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-md);padding:var(--space-5);color:var(--body);display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{margin:0;font:600 12px/16px var(--font-display);letter-spacing:1.5px;text-transform:uppercase;color:var(--primary-text)}
.eyebrow--warn{color:var(--warning-text)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ds-btn--outline .ico{stroke:var(--cian)}
.ds-btn--primary .ico{stroke:var(--on-primary)}

/* ---------- Tipografía ---------- */
h1,h2,h3,h4{margin:0;font-family:var(--font-display);color:var(--ink)}
.display{font:700 clamp(34px,5vw,56px)/1.1 var(--font-display);letter-spacing:-.5px}
h2{font:700 clamp(24px,2.9vw,32px)/1.25 var(--font-display)}
h3{font:600 clamp(18px,1.8vw,22.4px)/1.34 var(--font-display)}
h4{font:600 17.92px/1.45 var(--font-display)}
p{margin:0}
.lead{font:400 clamp(16px,1.5vw,18px)/1.6 var(--font-body);color:var(--body);max-width:70ch}
.small{font:400 14px/22px var(--font-body);color:var(--body)}
.caption{font:500 12px/18px var(--font-body);color:var(--mute)}
.slogan{font:300 16px/26px var(--font-body);color:var(--mute)}
.figure{font:700 clamp(36px,4.4vw,52px)/1.05 var(--font-display);letter-spacing:-.5px;font-variant-numeric:lining-nums}
.unit{font:500 14px/20px var(--font-body);color:var(--mute);margin-left:8px;-webkit-text-fill-color:initial}

/* ---------- Barra superior y progreso ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--topbar);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--gutter);background:color-mix(in srgb,var(--canvas) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--hairline)}
.brand{display:flex;align-items:center;gap:12px;font:700 18px/1 var(--font-display);color:var(--ink)}
.iso{width:30px;height:30px;flex:none}
.actions{display:flex;align-items:center;gap:var(--space-2)}
.actions .sep{width:1px;height:20px;background:var(--hairline-strong);margin:0 4px}
#progress{position:fixed;top:var(--topbar);left:0;height:2px;width:0;background:var(--grad);z-index:51;transition:width .5s var(--ease)}

/* ---------- Diapositivas ---------- */
.slide{position:relative;min-height:100svh;display:flex;flex-direction:column;padding:calc(var(--topbar) + 28px) var(--gutter) 20px;scroll-snap-align:start;background:var(--canvas)}
.slide.soft{background:var(--canvas-soft)}
.inner{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--space-6);width:100%;max-width:1200px;margin:0 auto;zoom:var(--zoom,1)}
.head{display:grid;gap:var(--space-3);max-width:920px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);width:100%;max-width:1200px;margin:20px auto 0;padding-top:16px;border-top:1px solid var(--hairline)}
.tags{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.pg{display:flex;align-items:center;gap:10px;font:500 12px/18px var(--font-body);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.pg .iso{width:20px;height:20px}

.grid{display:grid;gap:var(--space-5);grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
.grid--top{align-items:start}
/* Más de 3 tarjetas (o 4 con mucho texto): se reparten en filas y la última fila queda centrada */
.grid--wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--space-5)}
.grid--wrap>*{flex:0 0 calc((100% - (var(--cols) - 1) * var(--space-5)) / var(--cols));min-width:0}
.grid--top.grid--wrap{align-items:flex-start}
.disc-banner{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.disc-banner .saving{margin:0}

.rv{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--i,0)*70ms)}
.slide.in .rv{opacity:1;transform:none}

/* Listas */
.list{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-3)}
.list li{position:relative;padding-left:22px;font:400 16px/26px var(--font-body);color:var(--body)}
.list li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:50%;background:var(--verde)}
.list--out li::before{width:10px;height:2px;border-radius:2px;top:12px;background:var(--mute)}
.card .list li{font-size:15px;line-height:24px}
.card .list li::before{top:8px}
.card .list--out li::before{top:11px}

/* Portada */
.bar{display:block;width:96px;height:4px;border-radius:var(--radius-pill);background:var(--grad)}
.cover{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:var(--space-7);align-items:center}
.cover-main{display:grid;gap:var(--space-5)}
.kv{margin:0;display:grid}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);padding:12px 0;border-top:1px solid var(--hairline)}
.kv dt{font:500 14px/22px var(--font-body);color:var(--mute)}
.kv dd{margin:0;font:600 15px/22px var(--font-display);color:var(--ink);text-align:right}
.kv--stack>div{flex-direction:column;align-items:flex-start;gap:2px}
.kv--stack dd{text-align:left}
.card>.kv>div:first-child{border-top:0;padding-top:0}

/* Tabla */
.tbl{border:1px solid var(--hairline);border-radius:var(--radius-md);overflow:auto;background:var(--surface)}
table{width:100%;border-collapse:collapse;font:400 14px/20px var(--font-body)}
th{background:var(--surface-strong);color:var(--ink);font:600 13px/18px var(--font-display);text-align:left;padding:12px 16px;white-space:nowrap}
td{padding:9px 16px;border-top:1px solid var(--hairline);color:var(--body);vertical-align:top}
td:first-child{color:var(--ink)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td{background:var(--surface-strong);border-top:1px solid var(--hairline-strong);color:var(--ink);font:700 14px/20px var(--font-display);padding:12px 16px}
.tbl--wide table{min-width:540px}
/* Detalle agrupado: fases desplegables */
tr.grp{cursor:pointer}
tr.grp td{color:var(--ink);font:600 14px/20px var(--font-display);background:var(--surface-strong)}
tr.grp:hover td,tr.grp:focus-visible td{background:var(--surface);outline:none}
tr.grp .chev{display:inline-block;width:8px;height:8px;margin-right:12px;border-right:2px solid var(--cian);border-bottom:2px solid var(--cian);transform:rotate(-45deg);transition:transform .2s;vertical-align:2px}
tr.grp[aria-expanded="true"] .chev{transform:rotate(45deg)}
tr.grp .grp-meta{margin-left:10px;font:400 13px/20px var(--font-body);color:var(--mute)}
tr.sub{display:none}
tr.sub td:first-child{padding-left:36px;color:var(--body)}
tr.sub.open{display:table-row}
.tbl--wide td{padding:12px 16px}
.panel{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,.9fr);gap:var(--space-5);align-items:start}
.panel .figure{font-size:clamp(30px,3.3vw,42px)}
.price{display:flex;align-items:baseline;flex-wrap:wrap}
.paysteps{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:20px}
.paynum{font-size:clamp(28px,3vw,38px)!important}
.paylbl{font:600 15px/22px var(--font-display);color:var(--ink);margin-top:4px}
.stack{display:grid;gap:var(--space-5)}
.was-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.was{font:600 20px/1.2 var(--font-display);color:var(--mute);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--bruma);font-variant-numeric:lining-nums}
.ds-chip.off{font-weight:600;font-size:13px}
.saving{font:500 14px/22px var(--font-body);color:var(--primary-text)}
dd .was{font-size:13px;line-height:18px;margin-right:8px;text-decoration-thickness:1.5px}
dd .ds-chip{margin-left:8px;padding:3px 8px;font-size:11px}
.sched td.num,.sched th.num{text-align:right}
.sched tr.first td{background:color-mix(in srgb,var(--verde) 7%,transparent)}
.sched tr.first td:nth-child(3){color:var(--ink);font-weight:600}
.sched td.idx{color:var(--mute);width:44px;font-variant-numeric:tabular-nums}
.note{border-top:1px solid var(--hairline);padding-top:14px;display:grid;gap:6px}

/* Línea de tiempo (nodos y conectores en cian) */
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:var(--space-5)}
.tl li{position:relative;display:grid;gap:8px;align-content:start}
.tl li::after{content:"";position:absolute;top:15px;left:44px;right:-20px;height:2px;background:var(--cian);opacity:.45}
.tl li:last-child::after{display:none}
.tl .small{font-size:15px;line-height:24px}
.tl .when{font:600 12px/16px var(--font-display);letter-spacing:1.5px;text-transform:uppercase;color:var(--link)}
.tl .hrs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
td.fase{color:var(--mute);white-space:nowrap;font-size:13px}

/* Menú de secciones */
.menu-btn[aria-expanded="true"]{border-color:var(--cian)}
.scrim{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--azul) 60%,transparent);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(360px,88vw);display:flex;flex-direction:column;background:var(--canvas-soft);border-left:1px solid var(--hairline);transform:translateX(100%);transition:transform .35s var(--ease);visibility:hidden}
body.menu-open .scrim{opacity:1;pointer-events:auto}
body.menu-open .drawer{transform:none;visibility:visible}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--topbar);padding:0 20px;border-bottom:1px solid var(--hairline)}
.drawer nav{flex:1;overflow-y:auto;padding:12px}
.drawer ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.drawer a{display:flex;align-items:baseline;gap:14px;padding:11px 12px;border-radius:var(--radius-sm);font:500 15px/22px var(--font-body);color:var(--body);text-decoration:none;transition:background .2s var(--ease),color .2s var(--ease)}
.drawer a:hover{background:var(--surface);color:var(--ink)}
.drawer a .n{font:600 12px/22px var(--font-display);color:var(--mute);font-variant-numeric:tabular-nums;min-width:20px}
.drawer a[aria-current="true"]{background:var(--surface);color:var(--ink)}
.drawer a[aria-current="true"] .n{color:var(--primary-text)}
.drawer-foot{padding:16px 20px;border-top:1px solid var(--hairline)}
.node{display:grid;place-items:center;width:32px;height:32px;margin-bottom:6px;border-radius:50%;border:2px solid var(--cian);background:var(--canvas);font:600 13px/1 var(--font-display);color:var(--ink)}
.tl li:last-child .node{background:var(--verde);border-color:var(--verde);color:var(--on-primary)}

/* Cifras */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-6)}
.stats .caption{font-size:14px;line-height:22px}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}

/* Medios de pago */
.methods{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--space-5);align-items:start}
.methods-list{display:grid;gap:var(--space-4)}
.method{display:grid;gap:4px}
.method .mval{font:600 clamp(20px,2.2vw,26px)/1.2 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.method .mname{font:600 15px/22px var(--font-display);color:var(--ink)}
.qr-card{align-items:center;text-align:center}
.qr-frame{background:#fff;padding:14px;border-radius:var(--radius-md);width:100%;max-width:280px;margin:0 auto}
.qr-card img{display:block;width:100%;height:auto}
.qr-key{font:600 15px/22px var(--font-display);color:var(--ink)}
@media screen and (max-width:900px){.methods{grid-template-columns:minmax(0,1fr)}}

/* Cierre */
.closing{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:var(--space-7);align-items:center}
.closing-main{display:grid;gap:var(--space-5)}
.btns{display:flex;flex-wrap:wrap;gap:var(--space-3)}
.who{display:flex;align-items:center;gap:var(--space-4)}
.who .iso{width:52px;height:52px}
.who .name{font:700 22px/1.2 var(--font-display);color:var(--ink)}
.rule{border:0;border-top:1px solid var(--hairline);margin:0}

/* ---------- Responsive ---------- */
@media screen and (max-width:900px){
  .grid,.panel,.cover,.closing{grid-template-columns:minmax(0,1fr)}
  .paysteps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:minmax(0,1fr);gap:var(--space-5)}
  .cover,.closing{gap:var(--space-6)}
  .tl{grid-template-columns:minmax(0,1fr);gap:var(--space-5)}
  .tl li{padding-left:52px}
  .tl li .node{position:absolute;left:0;top:0;margin:0}
  .tl li::after{top:40px;bottom:-24px;left:15px;right:auto;width:2px;height:auto}
  .nav-only-desk{display:none}
  .grid--wrap>*{flex-basis:100%}
}
@media screen and (max-width:720px){
  :root{--topbar:56px}
  .lbl{display:none}
  .ds-btn--sm{padding:8px 10px}
  .brand{font-size:16px}
  .iso{width:26px;height:26px}
  .slide{padding-top:calc(var(--topbar) + 20px)}
  .foot{flex-direction:column;align-items:flex-start}
  .btns .ds-btn{width:100%;justify-content:center}
}
@media screen and (max-width:900px),screen and (max-height:800px){
  html{scroll-snap-type:y proximity}
}
@media screen and (max-height:800px) and (min-width:901px){
  .slide{padding-top:calc(var(--topbar) + 16px);padding-bottom:12px}
  .inner{gap:20px}
  .head{gap:var(--space-2)}
  td{padding:6px 16px}
  th{padding:10px 16px}
  .card{padding:20px;gap:12px}
  .figure{font-size:clamp(32px,3.6vw,40px)}
  .list{gap:8px}
  .foot{margin-top:12px;padding-top:12px}
  .card{padding:16px 20px;gap:10px}
  .was{font-size:16px}
  .paynum{font-size:28px!important}
  .figure{font-size:clamp(30px,3.2vw,36px)}
  .card .list li{font-size:14px;line-height:21px}
  .tbl--wide td{padding:9px 16px}
  .stack,.grid{gap:16px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .drawer,.scrim{transition:none}
  .rv{transition:none;opacity:1;transform:none}
  #progress{transition:none}
}

/* ---------- PDF / impresión: una página 16:9 por diapositiva ---------- */
@media print{
  tr.sub{display:table-row!important}
  tr.grp .chev{transform:rotate(45deg)}
  @page{size:1280px 720px;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html{scroll-snap-type:none;scroll-behavior:auto}
  .topbar,#progress,.drawer,.scrim{display:none!important}
  .slide{width:1280px;height:720px;min-height:0;overflow:hidden;padding:36px 48px 18px;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .rv{opacity:1!important;transform:none!important;transition:none!important}
  .inner{gap:var(--space-5);zoom:1}
  td{padding:7px 16px}
  .grad{padding:0 3px;margin:0 -3px;background-size:calc(100% - 2px) calc(100% - 2px);background-position:center;background-repeat:no-repeat}
  .head{gap:var(--space-2)}
  .card{padding:16px 20px;gap:10px}
  .was{font-size:16px}
  .paynum{font-size:28px!important}
  .figure{font-size:36px}
  .card .list li{font-size:14px;line-height:21px}
  .list{gap:8px}

  function pad(n){ return (n < 10 ? '0' : '') + n; }

    var n = items.length;
    if (n <= 3) return n || 2;
    var heavy = items.some(function(c){ return cardText(c).length > 190 || (c.items || []).length > 3; });
    if (n === 4) return heavy ? 2 : 4;
    return Math.ceil(n / 2);
  }
  function gridOpen(items, top){
    var cols = autoCols(items), wrap = items.length > cols;

        s.rows.map(function(r){ return '<tr>' + r.map(function(c, j){ return '<td' + cls(j) + '>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('')) +
        '</tbody>' + (s.total ? '<tfoot><tr>' + s.total.map(function(c, j){
          var g = (j > 0) ? ' class="' + (s.numeric && j === n - 1 ? 'num ' : '') + '"' : '';
          return '<td' + g + '>' + (j > 0 ? '<span class="grad">' + esc(c) + '</span>' : esc(c)) + '</td>';
        }).join('') + '</tr></tfoot>' : '') + '</table></div>';
      var callout = s.callout ? '<div class="card rv"><p class="eyebrow">' + esc(s.callout.eyebrow) + '</p><p class="lead">' + esc(s.callout.text) + '</p></div>' : '';
      if (!s.aside) return head(s) + t + callout;
      var a = s.aside;
      return head(s) + '<div class="panel">' + t +
        '<aside class="card rv"><p class="eyebrow">' + esc(a.eyebrow) + '</p>' +
        priceBlock(a.figure, a.unit, a.discount) +
        '<p class="small">' + esc(a.text) + '</p>' +
        (a.note ? '<div class="note"><p class="eyebrow' + (a.note.warn ? ' eyebrow--warn' : '') + '">' + esc(a.note.label) + '</p><p class="small">' + esc(a.note.text) + '</p></div>' : '') +
        '</aside></div>';
    },
    pricing: function(s){
      var plans = s.plans.map(function(p){
        return '<article class="card rv"><div style="display:flex;align-items:center;gap:10px">' + chip(p.name, p.chipVariant) + '</div>' +
          (s.discountBanner && p.discount ? '<div class="was-row"><span class="was" aria-label="Precio sin descuento">' + esc(p.discount.was) + '</span></div>' + priceBlock(p.price, p.unit, null)
            : priceBlock(p.price, p.unit, p.discount)) + list(p.items) + '</article>';
      });
      var pay = '<div class="card rv"><p class="eyebrow">' + esc(s.payment.heading) + '</p><div class="paysteps" style="--n:' + s.payment.steps.length + '">' +
        s.payment.steps.map(function(x){ return '<div><span class="figure grad paynum">' + esc(x.value) + '</span><p class="paylbl">' + esc(x.label) + '</p><p class="small">' + esc(x.text) + '</p></div>'; }).join('') +
        '</div></div>';
      var notes = '<div class="card rv"><p class="eyebrow eyebrow--warn">' + esc(s.notes.heading) + '</p>' + list(s.notes.items) + '</div>';
      if (plans.length === 1)
        return head(s) + '<div class="grid grid--top" style="--cols:2">' + plans[0] + '<div class="stack">' + pay + notes + '</div></div>';
      var banner = s.discountBanner ? '<div class="disc-banner rv">' + chip(s.discountBanner.off) + '<p class="saving">' + esc(s.discountBanner.text) + '</p></div>' : '';
      return head(s) + banner + gridOpen(s.plans, false) + plans.join('') + '</div>' +
        '<div class="grid grid--top" style="--cols:2">' + pay + notes + '</div>';
    },
    timeline: function(s){
      return head(s) + '<ol class="tl" style="--n:' + s.steps.length + '">' + s.steps.map(function(st, i){
        var h = st.hours, hrs = '';
        if (h && typeof h === 'object') {
          hrs = Object.keys(h).filter(function (k) { return parseFloat(String(h[k]).replace(',', '.')) > 0; })
            .map(function (k) { return chip(k + ' · ' + h[k] + ' h', (s.variants || {})[k]); }).join('');
        } else if (h && parseFloat(String(h).replace(',', '.')) > 0) { hrs = chip(h + ' h'); }
        return '<li class="rv"><span class="node">' + (i + 1) + '</span>' +
          (st.when ? '<p class="when">' + esc(st.when) + '</p>' : '') +
          '<h4>' + esc(st.title) + '</h4><p class="small">' + esc(st.text) + '</p>' +
          (hrs ? '<div class="hrs">' + hrs + '</div>' : '') + '</li>';
      }).join('') + '</ol>' +
      (s.callout ? '<div class="card rv"><p class="eyebrow">' + esc(s.callout.eyebrow) + '</p><p class="lead">' + esc(s.callout.text) + '</p></div>' : '');
    },
    twocol: function(s){
      function col(c){ return '<article class="card rv"><h3>' + esc(c.heading) + '</h3>' + list(c.items, c.out) + '</article>'; }
      return head(s) + '<div class="grid grid--top" style="--cols:2">' + col(s.left) + col(s.right) + '</div>';
    },
    proof: function(s){
      return head(s) +
        '<div class="stats">' + s.stats.map(function(x){ return '<div class="rv"><div class="figure grad">' + esc(x.figure) + '</div><p class="caption">' + esc(x.label) + '</p></div>'; }).join('') + '</div>' +
        '<div class="grid grid--top" style="--cols:' + s.groups.length + '">' + s.groups.map(function(g){
          return '<article class="card rv"><p class="eyebrow">' + esc(g.label) + '</p><div class="chips">' + g.items.map(function(it){
            return '<a class="ds-chip' + (g.variant === 'ai' ? ' ds-chip--ai' : '') + '" href="' + esc(safeHref(it[1])) + '" target="_blank" rel="noopener">' + esc(it[0]) + '</a>';
          }).join('') + '</div></article>';
        }).join('') + '</div>';
    },
    schedule: function(s){
      var nc = s.columns.length, nf = s.numFrom || nc;
      function c(j, extra){ var k = (j >= nf ? 'num' : '') + (j === 0 ? ' idx' : '') + (extra ? ' ' + extra : ''); return k.trim() ? ' class="' + k.trim() + '"' : ''; }
      var t = '<div class="tbl rv sched' + (nc > 5 ? ' tbl--wide' : '') + '"><table><thead><tr>' +
        s.columns.map(function(x, j){ return '<th' + c(j) + '>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        s.rows.map(function(r, i){ return '<tr' + (i === 0 && s.highlightFirst ? ' class="first"' : '') + '>' + r.map(function(x, j){ return '<td' + c(j) + '>' + esc(x) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody><tfoot><tr>' + s.total.map(function(x, j){ return '<td' + c(j) + '>' + (j >= nf ? '<span class="grad">' + esc(x) + '</span>' : esc(x)) + '</td>'; }).join('') + '</tr></tfoot></table></div>';
      var callout = s.callout ? '<div class="card rv"><p class="eyebrow">' + esc(s.callout.eyebrow) + '</p><p class="lead">' + esc(s.callout.text) + '</p></div>' : '';
      if (!s.aside) return head(s) + t + callout;
      var a = s.aside;
      return head(s) + '<div class="panel">' + t +
        '<aside class="card rv"><p class="eyebrow">' + esc(a.eyebrow) + '</p>' + priceBlock(a.figure, a.unit, a.discount) +
        (a.items ? '<div class="note">' + list(a.items) + '</div>' : '') + '</aside></div>' + callout;
    },
    methods: function(s){
      var list = '<div class="methods-list">' + s.methods.map(function(m){
        return '<article class="card rv method"><p class="eyebrow">' + esc(m.nombre) + '</p><span class="mval">' + esc(m.valor) + '</span><p class="small">' + esc(m.detalle) + '</p></article>';
      }).join('') + '<p class="caption rv">Titular: ' + esc(s.holder) + '</p></div>';
      var qr = s.qr && window.DS_QR_PAGO ? '<aside class="card rv qr-card"><p class="eyebrow">Escanea y paga</p><div class="qr-frame"><img src="' + window.DS_QR_PAGO + '" alt="QR de pago Bre-B de Bancolombia para DeerSystems"></div>' + (s.qrKey ? '<p class="qr-key">Llave ' + esc(s.qrKey) + '</p>' : '') + '<p class="small">Desde la app de tu banco, con Bre-B · Bancolombia.</p></aside>' : '';
      return head(s) + '<div class="methods">' + list + qr + '</div>' +
        (s.note ? '<div class="card rv"><p class="eyebrow">Ten en cuenta</p><p class="lead">' + esc(s.note) + '</p></div>' : '');
    },
    closing: function(s){
      var c = s.contact || {};
      return '<div class="closing"><div class="closing-main">' +
        '<p class="eyebrow rv">' + esc(s.eyebrow) + '</p><h2 class="rv" style="font-size:clamp(26px,3.4vw,38.4px)">' + esc(s.title) + '</h2>' +
        '<dl class="kv rv">' + s.summary.map(function(r){ return '<div><dt>' + esc(r[0]) + '</dt><dd>' + dd(r[1]) + '</dd></div>'; }).join('') + '</dl>' +
        '<div class="btns rv"><a class="ds-btn ds-btn--primary" href="' + esc(safeHref(s.cta.href)) + '">' + esc(s.cta.label) + ARROW + '</a>' +
        (s.secondary ? '<a class="ds-btn ds-btn--outline" href="' + esc(safeHref(s.secondary.href)) + '" target="_blank" rel="noopener">' + esc(s.secondary.label) + '</a>' : '') + '</div>' +
        '</div>' +
        '<aside class="card rv"><div class="who"><svg class="iso" aria-hidden="true"><use href="#iso"/></svg><div><div class="name">DeerSystems</div><p class="slogan" style="font-size:14px;line-height:22px">Sistemas que conectan, soluciones que simplifican.</p></div></div>' +
        '<hr class="rule"><div><h3>' + esc(c.name) + '</h3><p class="small">' + esc(c.role) + '</p></div>' +
        '<dl class="kv kv--stack" style="gap:0"><div><dt>Correo</dt><dd><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a></dd></div>' +
        '<div><dt>Web</dt><dd><a href="https://' + esc(c.web) + '" target="_blank" rel="noopener">' + esc(c.web) + '</a></dd></div></dl>' +
        '<p class="caption">' + esc(c.legal) + '</p></aside></div>';
    }
  };

  /* ---------- Render ---------- */
  deck.innerHTML = D.slides.map(function (s, i) {
    var tags = (s.tags || []).map(function (t) { return chip(t); }).join('');
    return '<section class="slide' + (s.bg === 'soft' ? ' soft' : '') + '" id="s' + (i + 1) + '" aria-label="Diapositiva ' + (i + 1) + ' de ' + total + '">' +
      '<div class="inner">' + R[s.type](s) + '</div>' +
      '<footer class="foot"><div class="tags">' + tags + '</div>' +
      '<div class="pg"><span>' + pad(i + 1) + ' / ' + pad(total) + '</span><svg class="iso" aria-hidden="true"><use href="#iso"/></svg></div></footer></section>';
  }).join('');

  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  slides.forEach(function (sl) {
    Array.prototype.forEach.call(sl.querySelectorAll('.rv'), function (el, k) { el.style.setProperty('--i', k); });
  });

  document.title = (D.meta && D.meta.titulo) || document.title;
  var t0 = document.title;

  /* Favicon con el isotipo */
  try {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="226 150 572 572" fill="none" stroke="url(#g)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="g" x1="0" y1="160" x2="0" y2="700" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7ED957"/><stop offset=".55" stop-color="#1FB8A8"/><stop offset="1" stop-color="#00B4D8"/></linearGradient><g id="h"><path d="M440 392 L270 292 L260 206M340 334 L340 172M340 292 L386 252M312 372 Q386 372 424 406 Q404 452 364 456 Q318 452 312 372 ZM404 440 L466 528 Q484 554 512 554M416 492 L422 590 L512 690"/><circle cx="258" cy="196" r="17" fill="url(#g)" stroke="none"/><circle cx="394" cy="244" r="16" fill="url(#g)" stroke="none"/></g></defs><use href="#h"/><use href="#h" transform="translate(1024 0) scale(-1 1)"/><path d="M490 490 L544 380"/></svg>';
    var l = document.createElement('link'); l.rel = 'icon'; l.href = 'data:image/svg+xml,' + encodeURIComponent(svg); document.head.appendChild(l);
  } catch (e) {}

  /* ---------- Navegación ---------- */
  var cur = 0, progress = document.getElementById('progress');
  function go(i){
    i = Math.max(0, Math.min(total - 1, i));
    slides[i].scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  function setCur(i){
    cur = i;
    var ml = document.querySelectorAll('#menuList a');
    for (var k = 0; k < ml.length; k++) { if (k === i) ml[k].setAttribute('aria-current', 'true'); else ml[k].removeAttribute('aria-current'); }
    progress.style.width = ((i + 1) / total * 100) + '%';
    document.getElementById('btnPrev').style.opacity = i === 0 ? .45 : 1;
    document.getElementById('btnNext').style.opacity = i === total - 1 ? .45 : 1;
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); setCur(slides.indexOf(e.target)); }
      });
    }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
    slides.forEach(function (s) { io.observe(s); });
    var io2 = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.12 });
    slides.forEach(function (s) { io2.observe(s); });
  } else { slides.forEach(function (s) { s.classList.add('in'); }); setCur(0); }

  document.getElementById('btnPrev').addEventListener('click', function () { go(cur - 1); });
  document.getElementById('btnNext').addEventListener('click', function () { go(cur + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (document.body.classList.contains('menu-open')) { if (k === 'Escape') openMenu(false); return; }
    if (k === 'm' || k === 'M') { openMenu(true); return; }
    if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(cur + 1); }
    else if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 'f' || k === 'F') { toggleFs(); }
  });

  /* ---------- Pantalla completa ---------- */
  var btnFs = document.getElementById('btnFs');
  var ICO_EXPAND = 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5';
  var ICO_SHRINK = 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5';
  function toggleFs(){
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    } catch (e) {}
  }
  if (!document.fullscreenEnabled) { btnFs.style.display = 'none'; }
  btnFs.addEventListener('click', toggleFs);
  document.addEventListener('fullscreenchange', function () {
    var on = !!document.fullscreenElement;
    document.querySelector('#icoFs path').setAttribute('d', on ? ICO_SHRINK : ICO_EXPAND);
    document.getElementById('lblFs').textContent = on ? 'Salir' : 'Pantalla completa';
    btnFs.setAttribute('aria-label', on ? 'Salir de pantalla completa' : 'Pantalla completa');
  });

  /* ---------- Descargas ---------- */
  var fileBase = (D.meta && D.meta.archivo) || 'Propuesta_DeerSystems';
  document.getElementById('btnPdf').addEventListener('click', function () {
    slides.forEach(function (s) { s.classList.add('in'); });
    document.title = fileBase;
    window.print();
  });
  window.addEventListener('afterprint', function () { document.title = t0; });
  /* ---------- Menú de secciones ---------- */
  var menuList = document.getElementById('menuList'), drawer = document.getElementById('drawer');
  var btnMenu = document.getElementById('btnMenu'), btnClose = document.getElementById('btnClose');
  var DEF = { cover: 'Portada', closing: 'Siguiente paso' };
  menuList.innerHTML = D.slides.map(function (s, i) {
    var label = s.menu || DEF[s.type] || s.eyebrow || ('Diapositiva ' + (i + 1));
    return '<li><a href="#s' + (i + 1) + '" data-i="' + i + '"><span class="n">' + pad(i + 1) + '</span><span>' + esc(label) + '</span></a></li>';
  }).join('');
  document.getElementById('menuMeta').textContent = [D.meta && D.meta.cliente, D.meta && D.meta.nro ? 'Propuesta DS-' + D.meta.nro : ''].filter(Boolean).join(' · ');
  var menuLinks = Array.prototype.slice.call(menuList.querySelectorAll('a'));
  function openMenu(on) {
    document.body.classList.toggle('menu-open', on);
    btnMenu.setAttribute('aria-expanded', on ? 'true' : 'false');
    drawer.setAttribute('aria-hidden', on ? 'false' : 'true');
    if (on) { (menuLinks[cur] || btnClose).focus(); } else { btnMenu.focus(); }
  }
  btnMenu.addEventListener('click', function () { openMenu(!document.body.classList.contains('menu-open')); });
  btnClose.addEventListener('click', function () { openMenu(false); });
  document.getElementById('scrim').addEventListener('click', function () { openMenu(false); });
  menuLinks.forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); openMenu(false); go(+a.getAttribute('data-i')); });
  });

  /* Escala automática: agranda el contenido en pantallas/proyectores grandes (nunca lo reduce) */
  function fit(){
    var w = window.innerWidth, h = window.innerHeight;
    var z = w > 1100 ? Math.max(1, Math.min(w / 1440, h / 900, 1.4)) : 1;
    document.documentElement.style.setProperty('--zoom', z.toFixed(3));
  }
  fit(); window.addEventListener('resize', fit);

  /* PDF: si una diapositiva no cabe en la página 16:9 (p. ej. tarjetas en dos filas), se reduce solo esa */
  function fitPrint(on){
    Array.prototype.forEach.call(document.querySelectorAll('.slide'), function(sl){
      var inn = sl.querySelector('.inner'); if (!inn) return;
      inn.style.zoom = '';
      if (!on) return;
      var cs = getComputedStyle(sl), pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      var avail = sl.clientHeight - pad, need = sl.scrollHeight - pad;
      if (need > avail + 1) inn.style.zoom = Math.max(0.6, avail / need - 0.01).toFixed(3);
    });
  }
  function toggleGrp(tr){
    var on = tr.getAttribute('aria-expanded') !== 'true';
    tr.setAttribute('aria-expanded', on ? 'true' : 'false');
    document.querySelectorAll('tr.sub[data-p="' + tr.getAttribute('data-g') + '"]').forEach(function(r){ r.classList.toggle('open', on); });
  }
  document.addEventListener('click', function(e){ var tr = e.target.closest && e.target.closest('tr.grp'); if (tr) toggleGrp(tr); });
  document.addEventListener('keydown', function(e){
    var tr = e.target.closest && e.target.closest('tr.grp');
    if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); toggleGrp(tr); }
  }, true);
  window.addEventListener('beforeprint', function(){ fitPrint(true); });
  window.addEventListener('afterprint', function(){ fitPrint(false); });
  var mqPrint = window.matchMedia && window.matchMedia('print');
  if (mqPrint) {
    var onMq = function(e){ fitPrint(e.matches); };
    if (mqPrint.addEventListener) mqPrint.addEventListener('change', onMq); else if (mqPrint.addListener) mqPrint.addListener(onMq);
  }

  setCur(0);
})();
</script>
</body>
